# Master coverage matrix: encodes the full capability spec as a trackable checklist (single source of truth).
# Gap analysis against the current state of the 405 cases. Each subdomain is annotated with:
#   leaves      number of leaf function points in this subdomain (rough estimate)
#   status      done (implemented cases) / partial (partial / structure exists) / todo (not started)
#   testability degree to which it's testable on this DUT (single box + hairpin loopback):
#     T1 = fully testable: config -> CONFIG_DB/ASIC_DB + single-box loopback data-plane behavior
#     T2 = config/programming testable: can configure + verify chip programming, but full behavior needs a peer / convergence / timing
#     T3 = needs external hardware: traffic generator / RoCE NIC / >=2 devices / AI NIC / optics; behavior not testable on a single box
#     T4 = platform gap / not applicable: unsupported by this image or chip, or a proprietary AI protocol that isn't standard SONiC
#   note        key remarks

meta:
  dut: x86_64-vendor-a_SW-A-128Q-r0 / PLAT-A-128Q / ASIC-A(asicA) / SDK6
  current_real_cases: "154 functional + 374 cli-smoke + chip-tables = 547 collectable"
  spec_total_leaves: ~700
  honest_coverage: "after waves A+B, the T1+T2 bulk has implemented cases (the functional-correctness layer of ~half the spec); T3/T4 (perf/RoCE/multi-node/AI-Fabric) is config-layer + skip; all pending on-device regression"
  status_note: "code written, compiles + collects on the build machine; not yet verified on device (per instructions); rc-guarded skips where CLI is uncertain, device defects not softened"

