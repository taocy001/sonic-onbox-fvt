# SONiC full-coverage feature catalog -- single source of truth for coverage tracking and case selection.
#
# Fields per feature point:
#   id            stable identifier (domain.feature)
#   domain        feature domain (maps to a pytest marker)
#   desc          one-line description
#   cli           main command line(s) involved (the object under test)
#   traffic       whether it programs chip entries and affects traffic (true => needs hairpin traffic verification)
#   pattern       verification pattern A (single-port punt to CPU) / B (dual-port counter) / C (dual-port capture) / null (pure CLI/DB)
#   verify        counter | capture | asicdb | cli | trap
#   module        test file carrying the case
#   status        planned | implemented | passing | skipped
#
# Progress: land the 4 domains (l2/l3/acl/trap) first, the rest planned. `make coverage` builds the matrix from this.

meta:
  hwsku: PLAT-A-128Q
  asic: vendor-x-asic-a
  loopback: "bcmsh SDK6 'port cd(N-1) lb=mac'; EthernetN<->cd(N-1) verified on real hardware"

features:
  # ===================== L2 =====================
  - id: l2.vlan.create
    domain: l2
    desc: Create/delete VLAN, add members (tagged/untagged)
    cli: ["config vlan add/del", "config vlan member add/del", "show vlan brief"]
    traffic: false
    pattern: null
    verify: asicdb
    module: tests/features/l2/test_vlan.py
    status: implemented
  - id: l2.vlan.untagged_fwd
    domain: l2
    desc: Untagged unicast forwarding within the same VLAN
    cli: ["config vlan member add -u"]
    traffic: true
    pattern: B
    verify: counter
    module: tests/features/l2/test_vlan.py
    status: implemented
  - id: l2.vlan.tag_push_pop
    domain: l2
    desc: Push/pop VLAN tag on trunk-port egress (packet rewrite)
    cli: ["config vlan member add (tagged)"]
    traffic: true
    pattern: C
    verify: capture
    module: tests/features/l2/test_vlan.py
    status: implemented
  - id: l2.fdb.static
    domain: l2
    desc: Static FDB entry programming and forwarding hit
    cli: ["config fdb add/del", "show mac"]
    traffic: true
    pattern: B
    verify: counter
    module: tests/features/l2/test_fdb.py
    status: implemented
  - id: l2.fdb.dynamic_learn
    domain: l2
    desc: Dynamic MAC learning (source MAC enters FDB)
    cli: ["show mac"]
    traffic: true
    pattern: A
    verify: asicdb
    module: tests/features/l2/test_fdb.py
    status: implemented
  - id: l2.fdb.aging
    domain: l2
    desc: FDB aging (entry disappears after the aging time expires)
    cli: ["config mac aging_time", "show mac"]
    traffic: true
    pattern: A
    verify: asicdb
    module: tests/features/l2/test_fdb.py
    status: planned
  - id: l2.flood.unknown_unicast
    domain: l2
    desc: Unknown unicast floods to the other members of the VLAN
    cli: []
    traffic: true
    pattern: B
    verify: counter
    module: tests/features/l2/test_flood.py
    status: planned
  - id: l2.flood.broadcast
    domain: l2
    desc: Broadcast frame flooding
    cli: []
    traffic: true
