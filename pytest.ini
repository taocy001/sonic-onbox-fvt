[pytest]
# Serial execution: loopback / FDB / ACL are all device-global state; parallel and random runs are forbidden
addopts = -ra -v -p no:randomly --strict-markers
testpaths = tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s | %(message)s
log_cli_date_format = %H:%M:%S

markers =
    smoke: post-deployment link/loopback smoke self-check
    traffic: traffic cases needing CPU tx/rx (depend on the loopback hairpin topology)
    gcu: GCU (generic_config_updater) JSON-patch config cases
    cli: pure CLI behavior/output/negative/idempotency, no traffic
    asicdb: verify chip entry programming via ASIC_DB
    # Feature domains
    l2: VLAN / FDB / flooding / MAC learning
    l3: interface IP / routing / neighbor / ECMP
    acl: ACL tables/rules/actions/counters
    qos: DSCP/PCP remap / queue / wred / pfc
    trap: protocol punt to CPU / CoPP
    mirror: SPAN / ERSPAN
    lag: PortChannel / LACP / hash
    vxlan: VTEP / tunnel encapsulation
    stp: PVST / port state
    crm: resource thresholds
    counters: port/queue counters / sFlow
    bgp: BGP routing protocol
    dhcp: DHCP relay
    mgmt: management-plane services (tacacs/radius/snmp/syslog/ntp/gnmi)
    chip: chip-entry SAI object programming coverage
    scenario: integrated real-world scenario combinations
    transceiver: optics/SFP show <-> STATE_DB consistency (read-only, no traffic)
    platform: platform fan/power/sensor show <-> STATE_DB consistency (pmon, read-only, no traffic)
    platform_fault: platform link fault injection (mock BMC -> sync -> cache -> pmon, destructive, runs only when FVT_PLATFORM_FAULT=1)
    chiptab: layer-4 assertions reading SDKLT lt chip tables directly (TM_*/PC_*)
    breakout: DPB dynamic port breakout (delete/create ports, most destructive, run alone in the final round)
    roce: RoCE/lossless (PFC/lossless buffer/ECN/DCQCN chain)
    scale: full-spec config-plane <-> chip-plane reconciliation (only lethal at scale, read-only)
    congestion: low-rate congestion bench (behavior cases that create real congestion by shaper rate-throttling)
    slow: long-running cases (e.g. full SONiC command-tree coverage); default rounds can exclude with -m "not slow"
    dlb: standalone DLB (dynamic load balancing) ECMP -- two-level group/member state/path-selection quality/PFC awareness (chip-dependent)
    # Verification patterns (correspond to Pattern A/B/C in the PLAN)
    pattern_a: single-port loopback + punt to CPU
    pattern_b: dual-port loopback + counters
    pattern_c: dual-port loopback + capture collector
